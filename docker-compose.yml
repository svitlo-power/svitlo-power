services:
  svitlo-power-rds:
    image: redis:7
    container_name: svitlo-power-rds
    volumes:
      - svitlo_power_rds_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - web_network
    labels:
      io.hass.type: "addon"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  svitlo-power-back-end:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    image: ${REGISTRY_URL}/svitlo-power-back-end:${TAG:-latest}
    restart: always
    env_file: .env
    environment:
      - DEBUG=False
    expose:
      - "5005"
    networks:
      - web_network
    labels:
      io.hass.type: "addon"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); result=s.connect_ex(('localhost', 5005)); s.close(); exit(0 if result==0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      svitlo-power-migrate:
        condition: service_completed_successfully
      svitlo-power-rds:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 15s

  svitlo-power-migrate:
    image: ${REGISTRY_URL}/svitlo-power-back-end:${TAG:-latest}
    container_name: svitlo-power-migrate
    env_file: .env
    command:
      [
        "beanie",
        "migrate",
        "-uri", "${MONGO_URI}",
        "-db", "${MONGO_DB}",
        "-p", "migrations/",
        "--no-use-transaction"
      ]
    networks:
      - web_network
    restart: "no"

  svitlo-power-tests:
    image: ${REGISTRY_URL}/svitlo-power-back-end:${TAG:-latest}
    profiles: ["tests"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir pytest==8.3.4 pytest-asyncio==0.25.2 --root-user-action=ignore && python -m pytest tests -v"
      ]
    working_dir: /svitlo-power-back-end
    networks:
      - web_network
    restart: "no"

  svitlo-power-sse-back-end:
    build:
      context: .
      dockerfile: sse-back-end/Dockerfile
    image: ${REGISTRY_URL}/svitlo-power-sse-back-end:${TAG:-latest}
    restart: always
    env_file: .env
    environment:
      - DEBUG=False
    expose:
      - "5005"
    networks:
      - web_network
    labels:
      io.hass.type: "addon"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); result=s.connect_ex(('localhost', 5005)); s.close(); exit(0 if result==0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      svitlo-power-rds:
        condition: service_healthy
    stop_signal: SIGINT
    stop_grace_period: 15s

  svitlo-power-grid-reporter:
    build:
      context: grid-reporter
      additional_contexts:
        shared: ./shared
    image: ${REGISTRY_URL}/svitlo-power-grid-reporter:${TAG:-latest}
    restart: always
    env_file: .env
    environment:
      CLIENTS_PATH: /app/clients.json
      STATE_PATH: /app/state.json
    volumes:
      - ./clients.json:/app/clients.json
      - ./grid-reporter/state.json:/app/state.json
    stop_grace_period: 10s
    networks:
      - web_network

    svitlo-power-app-back-end:
      build:
        context: .
        dockerfile: app-back-end/Dockerfile
      image: ${REGISTRY_URL}/svitlo-power-app-back-end:${TAG:-latest}
      restart: always
      env_file: .env
      environment:
        - DEBUG=False
      expose:
        - "8000"
      networks:
        - web_network
      labels:
        io.hass.type: "addon"
      healthcheck:
        test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); result=s.connect_ex(('localhost', 8000)); s.close(); exit(0 if result==0 else 1)"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      depends_on:
        svitlo-power-rds:
          condition: service_healthy
      stop_signal: SIGINT
      stop_grace_period: 15s

    svitlo-power-app-back-end-tests:
      image: ${REGISTRY_URL}/svitlo-power-app-back-end:${TAG:-latest}
      profiles: ["tests"]
      environment:
        - PYTHONDONTWRITEBYTECODE=1
      command:
        [
          "sh",
          "-c",
          "pip install --no-cache-dir pytest==8.3.4 pytest-asyncio==0.25.2 --root-user-action=ignore && python -m pytest tests -v"
        ]
      working_dir: /app
      networks:
        - web_network
      restart: "no"

  svitlo-power-front-end:
    build:
      context: front-end
      additional_contexts:
        shared: ./shared
    image: ${REGISTRY_URL}/svitlo-power-front-end:${TAG:-latest}
    restart: always
    ports:
      - "${OUTPUT_PORT:-5005}:80"
    networks:
      - web_network
    labels:
      io.hass.type: "addon"
    stop_signal: SIGQUIT
    depends_on:
      svitlo-power-back-end:
        condition: service_healthy

volumes:
  svitlo_power_rds_data:
  svitlo_power_mongo_data:

networks:
  web_network:
    driver: bridge
