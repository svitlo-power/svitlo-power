services:
  svitlo-power-mongo:
    image: mongo:7
    container_name: svitlo-power-mongo-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-supersecretpassword}
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_local_data:/data/db
    # Join the app stack's network so containers reach it as svitlo-power-mongo
    # (MONGO_URI=mongodb://user:pass@svitlo-power-mongo:27017 for Docker runs).
    networks:
      web_network:
        aliases:
          - svitlo-power-mongo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_local_data:

# Same definition as docker-compose.yml (same Compose project), so both
# files share the svitlo-power_web_network network.
networks:
  web_network:
    driver: bridge