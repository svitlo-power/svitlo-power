<!doctype html>
<html lang="uk" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="robots" content="noindex" />
    <title>Svitlo Power</title>
    <script>
      // Same storage keys as the app, so the page follows the user's saved theme and language.
      try {
        const theme = localStorage.getItem('svitlo.theme') || 'system'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <style>
      /* ---------- Design tokens (mirrors svitlo-power-app-v2/src/style.css) ---------- */
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --surface: #ffffff;
        --surface-2: #f0f2f5;
        --surface-3: #e6e9ee;
        --border: #e2e5ea;
        --text: #151a24;
        --text-2: #4a5263;
        --text-3: #7b8394;
        --accent: #f5b400;
        --accent-soft: #fff3cc;
        --accent-ink: #2b2100;
        --warn: #e8890c;
        --warn-soft: #fff0dc;
        --shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 4px 16px rgb(16 24 40 / 0.06);
        --radius: 16px;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0d1016;
        --surface: #151922;
        --surface-2: #1c212c;
        --surface-3: #252b38;
        --border: #252b37;
        --text: #eef1f6;
        --text-2: #b4bbc8;
        --text-3: #7e8798;
        --accent: #ffc72c;
        --accent-soft: #3a2f0d;
        --accent-ink: #1d1600;
        --warn: #ffa53d;
        --warn-soft: #3b2810;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      }

      /* ---------- Base ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      body {
        display: flex;
        flex-direction: column;
        min-width: 320px;
        min-height: 100dvh;
        color: var(--text);
        font: 15px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      p {
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      svg {
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- Header ---------- */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        padding: calc(16px + var(--safe-top)) 16px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand img {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }
      .brand strong {
        overflow: hidden;
        font-size: 16px;
        letter-spacing: -0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .logo-dark,
      :root[data-theme='dark'] .logo-light {
        display: none;
      }
      :root[data-theme='dark'] .logo-dark {
        display: block;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ---------- Controls ---------- */
      .icon-btn {
        display: inline-grid;
        flex: none;
        width: 42px;
        height: 42px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        transition: background 0.15s ease;
      }
      .icon-btn:hover {
        background: var(--surface-2);
      }
      .icon-moon,
      :root[data-theme='dark'] .icon-sun {
        display: none;
      }
      :root[data-theme='dark'] .icon-moon {
        display: block;
      }
      .segmented {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: var(--surface-3);
      }
      .segmented button {
        min-height: 34px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        color: var(--text-2);
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .segmented button[aria-pressed='true'] {
        color: var(--text);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      /* ---------- Content ---------- */
      main {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 32px 16px;
      }
      .card {
        display: grid;
        justify-items: center;
        gap: 14px;
        width: 100%;
        max-width: 480px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        text-align: center;
      }
      .badge {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        margin-bottom: 4px;
        border-radius: 50%;
        color: var(--accent-ink);
        background: var(--accent);
      }
      :root[data-theme='dark'] .badge {
        color: var(--accent);
        background: var(--accent-soft);
      }
      .badge svg {
        animation: flip 3s ease-in-out infinite;
      }
      .eyebrow {
        color: var(--text-3);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: -8px;
        font-size: 26px;
        font-weight: 750;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .desc {
        max-width: 380px;
        color: var(--text-2);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        padding: 4px 12px 4px 10px;
        border-radius: 999px;
        color: var(--warn);
        background: var(--warn-soft);
        font-size: 12.5px;
        font-weight: 650;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s ease-out infinite;
      }

      /* ---------- Footer ---------- */
      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px 14px;
        padding: 16px 16px calc(20px + var(--safe-bottom));
        color: var(--text-3);
        font-size: 13px;
      }
      footer a {
        color: var(--text-2);
        font-weight: 600;
        transition: color 0.15s ease;
      }
      footer a:hover {
        color: var(--text);
      }

      @media (min-width: 720px) {
        .top {
          padding-right: 24px;
          padding-left: 24px;
        }
      }
      @media (min-width: 1024px) {
        .top {
          padding: 24px 40px 0;
        }
        h1 {
          font-size: 30px;
        }
        .card {
          padding: 40px 32px;
        }
      }
      @media (max-width: 400px) {
        .brand strong {
          display: none;
        }
      }

      /* ---------- Animations ---------- */
      @keyframes flip {
        0%,
        35% {
          transform: rotate(0deg);
        }
        50%,
        85% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent);
        }
        100% {
          box-shadow: 0 0 0 8px transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    <script>
      const root = document.documentElement
      const systemDark = matchMedia('(prefers-color-scheme: dark)')

      const messages = {
        uk: {
          eyebrow: 'Технічні роботи',
          title: 'Хвилинка терпіння!',
          desc: 'Ми проводимо планове оновлення, щоб усе працювало швидше та плавніше. Дякуємо за ваше терпіння — вже майже готово!',
          status: 'Сторінка оновиться автоматично',
          authors: 'Автори',
          theme: 'Тема',
          language: 'Мова',
        },
        en: {
          eyebrow: 'Maintenance',
          title: 'Just a moment!',
          desc: "We're performing scheduled updates to make everything faster and smoother. Thanks for your patience — we're almost there.",
          status: 'This page will reload automatically',
          authors: 'Authors',
          theme: 'Theme',
          language: 'Language',
        },
        ru: {
          eyebrow: 'Технические работы',
          title: 'Минутку терпения!',
          desc: 'Мы проводим плановое обновление, чтобы всё работало быстрее и плавнее. Спасибо за терпение — почти готово!',
          status: 'Страница обновится автоматически',
          authors: 'Авторы',
          theme: 'Тема',
          language: 'Язык',
        },
      }

      function read(key, fallback) {
        try {
          return localStorage.getItem(key) || fallback
        } catch {
          return fallback
        }
      }
      function persist(key, value) {
        try {
          localStorage.setItem(key, value)
        } catch {}
      }

      // ---------- Theme ----------
      function applyTheme() {
        const theme = read('svitlo.theme', 'system')
        const dark = theme === 'dark' || (theme === 'system' && systemDark.matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0d1016' : '#f4f5f7')
      }
      document.getElementById('themeToggle').addEventListener('click', () => {
        persist('svitlo.theme', root.dataset.theme === 'dark' ? 'light' : 'dark')
        applyTheme()
      })
      systemDark.addEventListener('change', applyTheme)
      applyTheme()

      // ---------- Language ----------
      function resolveLocale(language) {
        if (language in messages) return language
        const system = navigator.language.slice(0, 2)
        return system === 'en' || system === 'ru' ? system : 'uk'
      }
      function applyLanguage() {
        const locale = resolveLocale(read('svitlo.language', 'system'))
        const dict = messages[locale]
        root.lang = locale
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = dict[el.dataset.i18n]
        })
        document.querySelectorAll('.segmented button').forEach((btn) => {
          btn.setAttribute('aria-pressed', String(btn.dataset.lang === locale))
        })
        document.querySelector('.segmented').setAttribute('aria-label', dict.language)
        document.getElementById('themeToggle').setAttribute('aria-label', dict.theme)
        document.title = `${dict.eyebrow} · Svitlo Power`
      }
      document.querySelectorAll('.segmented button').forEach((btn) => {
        btn.addEventListener('click', () => {
          persist('svitlo.language', btn.dataset.lang)
          applyLanguage()
        })
      })
      applyLanguage()

      // ---------- Reload once the backend is back ----------
      setInterval(() => {
        const eventSource = new EventSource('/api/events')
        eventSource.onopen = () => {
          eventSource.close()
          window.location.reload()
        }
        eventSource.onerror = () => {
          eventSource.close()
        }
      }, 5000)
    </script>
