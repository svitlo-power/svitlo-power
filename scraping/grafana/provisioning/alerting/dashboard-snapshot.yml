apiVersion: 1

groups:
  - orgId: 1
    name: dashboard-snapshot
    folder: Svitlo Power
    interval: 1m
    rules:
      - uid: dashboard-snapshot-write-errors
        title: Dashboard snapshot write failures
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(rate(dashboard_snapshot_write_errors_total[5m])) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
        dashboardUid: svitlo-application-metrics
        panelId: 7
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Dashboard snapshot publishes are failing
          description: Snapshot write failures occurred during the last five minutes.
        labels:
          severity: warning
      - uid: processing-shadow-parity-stale
        title: Shadow parity comparison is stale
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: time() - processing_shadow_last_comparison_timestamp_seconds{job="svitlo-power-processing"} > 900
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Shadow parity has not been refreshed recently
          description: No shadow comparison has completed in the last 15 minutes, so the parity reading is stale rather than healthy.
        labels:
          severity: warning
