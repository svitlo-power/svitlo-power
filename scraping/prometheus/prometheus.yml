global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: svitlo-power-back-end
    static_configs:
      - targets:
          - svitlo-power-back-end:9096

  - job_name: svitlo-power-app-back-end
    static_configs:
      - targets:
          - svitlo-power-app-back-end:9097

  - job_name: svitlo-power-sse-back-end
    static_configs:
      - targets:
          - svitlo-power-sse-back-end:9098

  - job_name: svitlo-power-grid-reporter
    static_configs:
      - targets:
          - svitlo-power-grid-reporter:9099

  - job_name: svitlo-power-front-end
    static_configs:
      - targets:
          - svitlo-power-front-end:5005
