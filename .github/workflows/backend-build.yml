name: Backend Build

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "back-end/**"
      - "sse-back-end/**"
      - "grid-reporter/**"
      - ".github/workflows/backend-build.yml"
      - ".github/scripts/detect-backend-images.sh"
      - ".github/actions/compute-image-version/**"
      - ".github/actions/cleanup-old-images/**"
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - "back-end/**"
      - "sse-back-end/**"
      - "grid-reporter/**"
      - ".github/workflows/backend-build.yml"
      - ".github/scripts/detect-backend-images.sh"
      - ".github/actions/compute-image-version/**"
      - ".github/actions/cleanup-old-images/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  detect-images:
    name: Detect changed images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected images
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-backend-images.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  test-docker:
    name: Tests (docker)
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 30
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build back-end image
        run: docker compose build svitlo-power-back-end

      - name: Run tests in docker
        id: tests
        run: |
          set -euo pipefail
          rm -f test_output.txt
          docker compose --profile tests run --rm --no-TTY svitlo-power-tests \
            | tee test_output.txt

      - name: Generate Docker Test Summary
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "## 🧪 Docker Test Summary"
            echo ""

            if [ ! -s test_output.txt ]; then
              echo "⚠️ No test output found."
              exit 0
            fi

            sed -r "s/\x1B\[[0-9;]*[a-zA-Z]//g" test_output.txt > test_output.clean.txt

            SUMMARY_LINE=$(grep -E "^=+.*(passed|failed|error|no tests ran|skipped).*=+$" \
                            test_output.clean.txt | tail -1)

            PASSED=$(grep -oE "[0-9]+ passed"   <<<"$SUMMARY_LINE" | grep -oE "^[0-9]+")
            FAILED=$(grep -oE "[0-9]+ failed"   <<<"$SUMMARY_LINE" | grep -oE "^[0-9]+")
            ERRORS=$(grep -oE "[0-9]+ errors?"  <<<"$SUMMARY_LINE" | grep -oE "^[0-9]+")
            SKIPPED=$(grep -oE "[0-9]+ skipped" <<<"$SUMMARY_LINE" | grep -oE "^[0-9]+")
            DURATION=$(grep -oE "in [0-9.]+s"   <<<"$SUMMARY_LINE" | tail -1 | sed "s/^in //")

            echo "| Result | Count |"
            echo "|--------|-------|"
            echo "| ✅ Passed   | ${PASSED:-0} |"
            echo "| ❌ Failed   | ${FAILED:-0} |"
            echo "| 🔥 Errors   | ${ERRORS:-0} |"
            echo "| ⏭️ Skipped  | ${SKIPPED:-0} |"
            echo "| ⏱️ Duration | ${DURATION:-n/a} |"
            echo ""

            if [ "${FAILED:-0}" -gt 0 ] || [ "${ERRORS:-0}" -gt 0 ]; then
              echo "<details><summary>Failed / errored tests</summary>"
              echo ""
              echo "```"
              grep -E "^(FAILED|ERROR)" test_output.clean.txt | sort -u \
                || echo "(not parsed, see full log)"
              echo "```"
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-test-log
          path: test_output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup compose stack
        if: always()
        run: docker compose --profile tests down --remove-orphans --volumes || true

  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 45
    needs: [detect-images, test-docker]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.detect-images.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute version
        id: compute
        uses: ./.github/actions/compute-image-version
        with:
          image-name: ${{ matrix.image }}
          registry-url: ${{ env.REGISTRY }}
          registry-username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.compute.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.compute.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  cleanup:
    name: Cleanup old images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push, detect-images]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-images.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup old image versions
        uses: ./.github/actions/cleanup-old-images
        with:
          image-name: ${{ matrix.image }}
          registry-url: ${{ env.REGISTRY }}
          registry-username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}