name: Backend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    name: Docker Test Summary
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Build back-end image
        run: docker compose build svitlo-power-back-end

      - name: Run tests in docker
        id: tests
        run: |
          set -o pipefail
          docker compose --profile tests run --rm svitlo-power-tests | tee test_output.txt

      - name: Generate Docker Test Summary
        if: always()
        run: |
          {
            echo "## 🧪 Docker Test Summary"
            echo ""
            if [ -f test_output.txt ]; then
              PASSED=$(grep -oE '[0-9]+ passed' test_output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
              FAILED=$(grep -oE '[0-9]+ failed' test_output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
              ERRORS=$(grep -oE '[0-9]+ error' test_output.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
              DURATION=$(grep -oE 'in [0-9.]+s' test_output.txt | tail -1)
              echo "| Result | Count |"
              echo "|--------|-------|"
              echo "| ✅ Passed | $PASSED |"
              echo "| ❌ Failed | $FAILED |"
              echo "| 🔥 Errors | $ERRORS |"
              echo "| ⏱ Duration | ${DURATION:-n/a} |"
              echo ""
              if grep -qE '(failed|error)' test_output.txt; then
                echo "<details><summary>Failed tests</summary>"
                echo ""
                echo '```'
                grep -E '^FAILED' test_output.txt
                echo '```'
                echo "</details>"
              fi
            else
              echo "⚠️ No test output found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install shared package dependencies
        run: |
          cd shared/python
          pip install -e .

      - name: Install back-end test dependencies
        run: |
          cd back-end
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run shared package tests
        run: |
          cd shared/python
          python -m pytest tests/ -v

      - name: Run back-end tests
        run: |
          cd back-end
          python -m pytest tests/ -v

  build-and-push:
    name: Build and Push Images
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata for back-end
        id: meta-back-end
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.REGISTRY_URL }}/svitlo-power-back-end
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push back-end
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: back-end/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-back-end.outputs.tags }}
          labels: ${{ steps.meta-back-end.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for migrate
        id: meta-migrate
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.REGISTRY_URL }}/svitlo-power-migrate
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push migrate
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: back-end/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for sse-back-end
        id: meta-sse-back-end
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.REGISTRY_URL }}/svitlo-power-sse-back-end
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push sse-back-end
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: sse-back-end/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-sse-back-end.outputs.tags }}
          labels: ${{ steps.meta-sse-back-end.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max