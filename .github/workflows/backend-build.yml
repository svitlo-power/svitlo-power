  #       with:
  #         persist-credentials: false
  #
  #     - name: Set up Python
  #       uses: actions/setup-python@v7
  #       with:
  #         python-version: '3.14'
  #         cache: 'pip'
  #         cache-dependency-path: back-end/requirements.txt
  #
  #     - name: Install shared package
  #       working-directory: shared/python
  #       run: pip install -e .
  #
  #     - name: Install back-end test dependencies
  #       working-directory: back-end
  #       run: |
  #         pip install -r requirements.txt
  #         pip install pytest pytest-asyncio
  #
  #     - name: Run shared package tests
  #       working-directory: shared/python
  #       run: python -m pytest tests/ -v
  #
  #     - name: Run back-end tests
  #       working-directory: back-end
  #       run: python -m pytest tests/ -v

  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 45
    needs: [test-docker]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: svitlo-power-back-end
            dockerfile: back-end/Dockerfile
          # same Dockerfile/context as back-end — identical image, verify intent
          - image: svitlo-power-migrate
            dockerfile: back-end/Dockerfile
          - image: svitlo-power-sse-back-end
            dockerfile: sse-back-end/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}