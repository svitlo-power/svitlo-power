name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - "front-end/**"
      - "shared/i18n/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "front-end/**"
      - "shared/i18n/**"
      - ".github/workflows/frontend-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL }}

jobs:
  run-tests:
    name: Run front-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-end

      - name: Run tests
        run: npm run test:run
        working-directory: front-end

  compute-version:
    name: Compute image version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compute version
        id: compute
        uses: ./.github/actions/compute-image-version
        with:
          image-name: svitlo-power-front-end
          registry-url: ${{ env.REGISTRY }}
          registry-username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          is-pr: ${{ github.event_name == 'pull_request' }}

  build-and-push:
    name: Build front-end image
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 45
    needs: [compute-version, run-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/svitlo-power-front-end
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.compute-version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: front-end
          file: front-end/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.compute-version.outputs.version }}
          cache-from: type=gha,scope=svitlo-power-front-end
          cache-to: type=gha,mode=max,scope=svitlo-power-front-end
          build-contexts: |
            shared=./shared

  cleanup:
    name: Cleanup old images
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup svitlo-power-front-end
        uses: ./.github/actions/cleanup-old-images
        with:
          image-name: svitlo-power-front-end
          registry-url: ${{ env.REGISTRY }}
          registry-username: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
