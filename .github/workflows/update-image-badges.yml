name: Update Image Version Badges

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-image-badges.yml"
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

# Force workflow refresh - 2026-10-25
# Updated: 2026-10-25

permissions:
  contents: write  # To commit badge JSON files

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Query registry and generate badges
        id: badges
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          
          # Normalize registry URL
          if [[ "${REGISTRY_URL}" =~ ^https?:// ]]; then
            REGISTRY_BASE="${REGISTRY_URL%/}"
          else
            REGISTRY_BASE="https://${REGISTRY_URL%/}"
          fi
          
          AUTH_HEADER=""
          if [[ -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_PASSWORD}" ]]; then
            AUTH_HEADER="Authorization: Basic $(echo -n "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" | base64 -w 0)"
          fi
          
          IMAGES=("svitlo-power-back-end" "svitlo-power-front-end" "svitlo-power-sse-back-end" "svitlo-power-grid-reporter" "svitlo-power-app-back-end")
          
          mkdir -p .github/badges
          
          for IMAGE in "${IMAGES[@]}"; do
            echo "Querying ${IMAGE}..."
            TAGS_JSON=$(curl -sSL -H "${AUTH_HEADER}" "${REGISTRY_BASE}/v2/${IMAGE}/tags/list" 2>&1)
            
            if echo "${TAGS_JSON}" | jq empty 2>/dev/null; then
              if echo "${TAGS_JSON}" | jq -e '.errors' >/dev/null 2>&1; then
                ERROR_CODE=$(echo "${TAGS_JSON}" | jq -r '.errors[0].code // "UNKNOWN"')
                if [[ "${ERROR_CODE}" == "NAME_UNKNOWN" ]]; then
                  VERSION="no tags"
                else
                  VERSION="error"
                fi
              else
                # Get latest tag matching yyyy.mm.nn pattern
                VERSION=$(echo "${TAGS_JSON}" | jq -r '.tags[]?' 2>/dev/null | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1 || echo "no tags")
              fi
            else
              VERSION="query failed"
            fi
            
            # Generate shields.io endpoint JSON
            cat > ".github/badges/${IMAGE}.json" <<EOF
{
  "schemaVersion": 1,
  "label": "${IMAGE}",
  "message": "${VERSION}",
  "color": "blue"
}
EOF
            echo "Generated badge for ${IMAGE}: ${VERSION}"
          done

      - name: Commit and push badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update image version badges [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi