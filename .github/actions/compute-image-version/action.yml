name: "Compute Image Version"
description: "Queries registry tags and computes yyyy.mm.nn version for current month"
inputs:
  image-name:
    description: "Name of the Docker image (e.g., svitlo-power-back-end)"
    required: true
  registry-url:
    description: "Docker registry URL (e.g., ghcr.io or docker.io)"
    required: true
  registry-username:
    description: "Registry username for authentication"
    required: false
  registry-password:
    description: "Registry password/token for authentication"
    required: false
outputs:
  version:
    description: "Computed version in yyyy.mm.nn format"
    value: ${{ steps.compute.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Compute version
      id: compute
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        set -euo pipefail
        
        # Default version for local builds / no registry access
        DEFAULT_VERSION="0000.00.00"
        
        # Get current UTC year and month
        YEAR=$(date -u +%Y)
        MONTH=$(date -u +%m)
        PREFIX="${YEAR}.${MONTH}."
        
        echo "Current UTC year/month: ${YEAR}.${MONTH}"
        echo "Looking for tags with prefix: ${PREFIX}"
        
        # Normalize registry URL to include https:// if protocol is missing
        if [[ "${REGISTRY_URL}" =~ ^https?:// ]]; then
          REGISTRY_BASE="${REGISTRY_URL%/}"
        else
          REGISTRY_BASE="https://${REGISTRY_URL%/}"
        fi
        
        REGISTRY_API_URL="${REGISTRY_BASE}/v2/${IMAGE_NAME}/tags/list"
        
        # Prepare auth header if credentials provided
        AUTH_HEADER=""
        if [[ -n "${REGISTRY_USERNAME}" && -n "${REGISTRY_PASSWORD}" ]]; then
          AUTH_HEADER="Authorization: Basic $(echo -n "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" | base64 -w 0)"
        fi
        
        # Query registry for tags with retry logic for transient failures
        MAX_RETRIES=3
        RETRY_DELAY=2
        TAGS_JSON=""
        CURL_EXIT_CODE=0
        
        for attempt in $(seq 1 ${MAX_RETRIES}); do
          echo "Querying registry (attempt ${attempt}/${MAX_RETRIES})..."
          TAGS_JSON=$(curl -sSL -H "${AUTH_HEADER}" "${REGISTRY_API_URL}" 2>&1)
          CURL_EXIT_CODE=$?
          
          if [[ ${CURL_EXIT_CODE} -eq 0 ]]; then
            # Check if response is valid JSON
            if echo "${TAGS_JSON}" | jq empty 2>/dev/null; then
              # Check if registry returned an error
              if ! echo "${TAGS_JSON}" | jq -e '.errors' >/dev/null 2>&1; then
                echo "Registry query successful"
                break
              else
                echo "Registry returned error: $(echo "${TAGS_JSON}" | jq -c '.errors')"
              fi
            else
              echo "Invalid JSON response: ${TAGS_JSON}"
            fi
          else
            echo "Curl failed with exit code: ${CURL_EXIT_CODE}"
          fi
          
          if [[ ${attempt} -lt ${MAX_RETRIES} ]]; then
            echo "Retrying in ${RETRY_DELAY}s..."
            sleep ${RETRY_DELAY}
            RETRY_DELAY=$((RETRY_DELAY * 2))
          fi
        done
        
        if [[ ${CURL_EXIT_CODE} -ne 0 ]] || ! echo "${TAGS_JSON}" | jq empty 2>/dev/null || echo "${TAGS_JSON}" | jq -e '.errors' >/dev/null 2>&1; then
          echo "Error: Failed to query registry at ${REGISTRY_API_URL} after ${MAX_RETRIES} attempts"
          echo "Last response: ${TAGS_JSON}"
          exit 1
        fi
        
        # Extract tags matching yyyy.mm.nn pattern for current month
        # Use jq --arg to safely pass the prefix variable (avoids quoting issues)
        MATCHING_TAGS=$(echo "${TAGS_JSON}" | jq -r --arg prefix "${PREFIX}" '.tags[]? | select(. | startswith($prefix))' 2>/dev/null | sort -V || true)
        
        if [[ -z "${MATCHING_TAGS}" ]]; then
          # No existing tags for this month, start at 00
          NN="00"
        else
          # Get highest nn from matching tags and always increment
          HIGHEST=$(echo "${MATCHING_TAGS}" | tail -1 | sed -E "s/^${PREFIX}//")
          NN=$(printf "%02d" $((10#${HIGHEST} + 1)))
        fi
        
        VERSION="${PREFIX}${NN}"
        echo "Computed version: ${VERSION}"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

    - name: Publish computed version
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ steps.compute.outputs.version }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_HEAD_REF: ${{ github.head_ref }}
      run: |
        {
          echo "## 🐳 Docker Image"
          echo ""
          echo "| | Value |"
          echo "|---|---|"
          echo "| **Image** | \`${IMAGE_NAME}:${VERSION}\` |"
          echo "| **Version** | \`${VERSION}\` |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"